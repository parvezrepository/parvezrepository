
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Create Profile Directory
        run: mkdir -p profile

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=parvezrepository&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0B1020&title_color=67D5FF&icon_color=A78BFA&text_color=DCE6F5
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=parvezrepository&layout=compact&theme=tokyonight&hide_border=true&bg_color=0B1020&title_color=67D5FF&text_color=DCE6F5&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet && exit 0

          git commit -m "Update GitHub profile statistics"
          git push
